spring:
  application:
    name: notification-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/geozentra}
          # An explicit key endpoint avoids a Keycloak discovery request during startup.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/geozentra}/protocol/openid-connect/certs}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geozentra_notifications}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: ${DB_SSL_MODE:prefer}
        sslrootcert: ${DB_SSL_ROOT_CERT:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: ${NOTIFICATIONS_CONSUMER_ENABLED:true}
        concurrency: ${NOTIFICATIONS_CONSUMERS:1}
        max-concurrency: ${NOTIFICATIONS_MAX_CONSUMERS:2}
        prefetch: ${NOTIFICATIONS_PREFETCH:5}
        missing-queues-fatal: true
        # Bounded retries and confirmed DLQ recovery are configured in NotificationRabbitConfig.
        retry:
          enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${APP_PORT:8082}
notifications:
  email:
    inbox-url: ${NOTIFICATIONS_EMAIL_INBOX_URL:http://localhost:4200/notifications}
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    from-address: ${SES_FROM_ADDRESS:}
    region: ${SES_REGION:us-east-1}
    poll-delay-millis: ${NOTIFICATIONS_EMAIL_POLL_DELAY_MILLIS:30000}
    steps-per-tick: ${NOTIFICATIONS_EMAIL_STEPS_PER_TICK:10}
    max-digest-items: ${NOTIFICATIONS_EMAIL_MAX_DIGEST_ITEMS:100}
    max-attempts: ${NOTIFICATIONS_EMAIL_MAX_ATTEMPTS:3}
    retry-delay-seconds: ${NOTIFICATIONS_EMAIL_RETRY_DELAY_SECONDS:60}
    timeout-seconds: ${SES_TIMEOUT_SECONDS:10}
    lease-seconds: ${NOTIFICATIONS_EMAIL_LEASE_SECONDS:120}
  exchange: ${ALERTS_EXCHANGE:geozentra.alerts}
  queue: ${ALERTS_QUEUE:geozentra.notifications.alerts}
  routing-key: ${ALERTS_ROUTING_KEY:alerts.v1}
  contact-routing-key: ${CONTACT_REQUEST_ROUTING_KEY:contacts.v1}
  dead-letter-exchange: ${NOTIFICATIONS_DLX:geozentra.notifications.dead}
  dead-letter-queue: ${NOTIFICATIONS_DLQ:geozentra.notifications.alerts.dlq}
  dead-letter-routing-key: ${NOTIFICATIONS_DLQ_ROUTING_KEY:alerts.failed.v1}
  max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:3}
  retry-initial-millis: ${NOTIFICATIONS_RETRY_INITIAL_MILLIS:1000}
  retry-max-millis: ${NOTIFICATIONS_RETRY_MAX_MILLIS:10000}
  confirm-timeout-seconds: ${NOTIFICATIONS_CONFIRM_TIMEOUT_SECONDS:10}
  max-body-bytes: ${NOTIFICATIONS_MAX_BODY_BYTES:262144}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
