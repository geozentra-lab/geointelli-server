
name: GeoZentra Backend CI

on:
  pull_request:
    branches:
      - integration-testing
      - master
  push:
    branches:
      - integration-testing
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: property-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: property-service/pom.xml

      - name: Build and run tests
        run: mvn -B clean verify
