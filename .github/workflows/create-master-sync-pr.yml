
name: Create master synchronization PR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-integration-sync-pr
  cancel-in-progress: false

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest
    environment: branch-sync

    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create synchronization PR if needed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          existing=$(gh pr list \
            --repo "$GH_REPO" \
            --base integration-testing \
            --head master \
            --state open \
            --json number \
            --jq 'length')

          if [[ "$existing" -gt 0 ]]; then
            echo "Synchronization PR already exists."
            exit 0
          fi

          ahead=$(gh api \
            "repos/$GH_REPO/compare/integration-testing...master" \
            --jq '.ahead_by')

          if [[ "$ahead" -eq 0 ]]; then
            echo "No new master commits to synchronize."
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --base integration-testing \
            --head master \
            --title "chore: sync master into integration-testing" \
            --body "Automated synchronization of master into integration-testing. If conflicts occur, resolve them manually. All required branch protections remain in effect."
