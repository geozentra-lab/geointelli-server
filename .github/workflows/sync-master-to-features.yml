
name: Sync master to feature branches

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-master-to-features
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: branch-sync

    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Update open feature PR branches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "geozentra-sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] |
              select(.base.ref == "master" or .base.ref == "integration-testing") |
              select(.head.repo.full_name == .base.repo.full_name) |
              select(.head.ref | startswith("feature/") or startswith("features/")) |
              [.number, .head.ref] | @tsv' |
          while IFS=$'\t' read -r pr branch; do
            echo "Checking PR #$pr: $branch"

            if ! git fetch origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "Branch unavailable; skipping"
              continue
            fi

            git switch --force-create sync-work \
              "refs/remotes/origin/$branch"

            if git merge-base --is-ancestor origin/master HEAD; then
              echo "Already up to date"
              continue
            fi

            if git merge --no-ff --no-edit origin/master; then
              if git push origin "HEAD:refs/heads/$branch"; then
                echo "Updated $branch"
              else
                echo "Push rejected; branch may have changed"
              fi
            else
              git merge --abort || true
              echo "Conflict in $branch; skipped"

              gh pr comment "$pr" \
                --body "Automatic master synchronization was skipped because of merge conflicts. Please merge master into this feature branch manually." \
                || true
            fi
          done
