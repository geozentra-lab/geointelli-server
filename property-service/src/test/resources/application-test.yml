# Context smoke test only: PostgreSQL/PostGIS migrations require a separate database test.
spring:
  datasource:
    url: jdbc:h2:mem:context-test;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never

aws:
  region: us-east-1
  s3:
    bucket: context-test

mapillary:
  access-token: ""
  roads-file: ""
