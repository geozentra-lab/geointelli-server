spring:
  jpa:
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        jdbc:
          fetch_size: 10

  sql:
    init:
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/geozentra}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/geozentra}/protocol/openid-connect/certs}

  flyway:
    enabled: false
    # baseline-on-migrate: true
    # baseline-version: 1
server:
  port: ${APP_PORT:8081}
  
logging:
  level:
    root: INFO
    com:
      geointelli: DEBUG
    org:
      springframework: WARN
      hibernate: WARN # DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"  
  file:
    name: logs/springboot.log
