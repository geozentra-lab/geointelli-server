spring:
  application:
    name: geointelli

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    properties:
      hibernate:
        # Loads lazy associations for up to 100 parents per query instead of one query each.
        default_batch_fetch_size: 100

  servlet:
    multipart:
      # CSV uploads for /api/ingestion/import/*; a folder upload sends up to 13 files in one request.
      max-file-size: ${INGESTION_MAX_UPLOAD_SIZE:1024MB}
      max-request-size: ${INGESTION_MAX_REQUEST_SIZE:4096MB}
      file-size-threshold: 1MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geozentra}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: ${DB_SSL_MODE:prefer}
        sslrootcert: ${DB_SSL_ROOT_CERT:}

server:
  port: ${APP_PORT:8080}

aws:
  region: ${AWS_REGION}
  access_key: ${AWS_ACCESS_KEY}
  secret_key: ${AWS_SECRET_ACCESS_KEY}

  s3:
    bucket: geozentra-images-prod-286528690180-us-east-1-an
mapillary:
  backfill:
    workers: ${MAPILLARY_BACKFILL_WORKERS:2}
  access-token: ${MAPILLARY_ACCESS_TOKEN:}
  roads-file: ${MAPILLARY_ROADS_FILE:}

images:
  local-directory: ${IMAGES_LOCAL_DIRECTORY:images}

# Background CSV import and Miami-Dade ingestion jobs (SCRUM-188).
ingestion:
  input:
    # s3: inputs are shared, any instance can run or retry a job. local: jobs are pinned to this instance.
    storage: ${INGESTION_INPUT_STORAGE:s3}
    s3-bucket: ${INGESTION_S3_BUCKET:${aws.s3.bucket}}
    s3-prefix: ${INGESTION_S3_PREFIX:ingestion/inputs}
    local-directory: ${INGESTION_INPUT_DIRECTORY:ingestion-inputs}
    # Files in this directory may be named (stagedFile=...) instead of uploaded; empty disables it.
    staging-directory: ${INGESTION_STAGING_DIRECTORY:}
  jobs:
    enabled: ${INGESTION_JOBS_ENABLED:true}
    instance-id: ${INGESTION_INSTANCE_ID:}
    poll-delay-millis: ${INGESTION_JOBS_POLL_DELAY_MILLIS:5000}
    lease-seconds: ${INGESTION_JOBS_LEASE_SECONDS:600}
    heartbeat-seconds: 30
    queue-deadline-seconds: ${INGESTION_JOBS_QUEUE_DEADLINE_SECONDS:600}
    csv-batch-size: ${INGESTION_CSV_BATCH_SIZE:500}
    max-items-per-job: 1000
    api-workers: ${INGESTION_API_WORKERS:10}
    api-batch-size: 50
    api-batch-pause-millis: 2000
    api-attempts: 3

contact-requests:
  publisher-enabled: ${CONTACT_REQUEST_PUBLISHER_ENABLED:false}
  exchange: ${ALERTS_EXCHANGE:geozentra.alerts}
  queue: ${ALERTS_QUEUE:geozentra.notifications.alerts}
  routing-key: ${CONTACT_REQUEST_ROUTING_KEY:contacts.v1}
  poll-delay-millis: ${CONTACT_REQUEST_POLL_DELAY_MILLIS:5000}
  batch-size: ${CONTACT_REQUEST_BATCH_SIZE:20}
  max-attempts: ${CONTACT_REQUEST_MAX_ATTEMPTS:10}
  confirm-timeout-seconds: ${CONTACT_REQUEST_CONFIRM_TIMEOUT_SECONDS:10}
  retry-base-seconds: ${CONTACT_REQUEST_RETRY_BASE_SECONDS:30}

alerts:
  enabled: ${ALERTS_ENABLED:false}
  poll-delay-millis: ${ALERTS_POLL_DELAY_MILLIS:30000}
  id-batch-size: ${ALERTS_ID_BATCH_SIZE:500}
  steps-per-tick: ${ALERTS_STEPS_PER_TICK:10}
  retry-delay-seconds: ${ALERTS_RETRY_DELAY_SECONDS:300}
  max-scan-age-minutes: ${ALERTS_MAX_SCAN_AGE_MINUTES:1440}
  publisher:
    enabled: ${ALERTS_PUBLISHER_ENABLED:false}
    poll-delay-millis: ${ALERTS_PUBLISH_POLL_DELAY_MILLIS:5000}
    batch-size: ${ALERTS_PUBLISH_BATCH_SIZE:20}
    max-attempts: ${ALERTS_PUBLISH_MAX_ATTEMPTS:10}
    confirm-timeout-seconds: ${ALERTS_PUBLISH_CONFIRM_TIMEOUT_SECONDS:10}
    retry-base-seconds: ${ALERTS_PUBLISH_RETRY_BASE_SECONDS:30}
    exchange: ${ALERTS_EXCHANGE:geozentra.alerts}
    queue: ${ALERTS_QUEUE:geozentra.notifications.alerts}
    routing-key: ${ALERTS_ROUTING_KEY:alerts.v1}

# Web client origins allowed by CorsConfig (comma separated), e.g. the EC2 frontend URL.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
