spring:
  application:
    name: geointelli

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geozentra}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: ${DB_SSL_MODE:prefer}
        sslrootcert: ${DB_SSL_ROOT_CERT:}

server:
  port: ${APP_PORT:8080}

aws:
  region: ${AWS_REGION}
  access_key: ${AWS_ACCESS_KEY}
  secret_key: ${AWS_SECRET_ACCESS_KEY}

  s3:
    bucket: geozentra-images-prod-286528690180-us-east-1-an
mapillary:
  backfill:
    workers: ${MAPILLARY_BACKFILL_WORKERS:2}
  access-token: ${MAPILLARY_ACCESS_TOKEN:}
  roads-file: ${MAPILLARY_ROADS_FILE:}

images:
  local-directory: ${IMAGES_LOCAL_DIRECTORY:images}
