version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: geointelli-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-geozentra}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: geointelli-keycloak
    command: start-dev
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-geozentra}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8090:8081"
    depends_on:
      - postgres

  app:
    build: .
    container_name: geointelli-app
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      - postgres
      - keycloak
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # APP_PORT controls the published host port; the container listens on 8080.
      SERVER_PORT: 8080
      # Keep host-machine localhost settings out of the app container.
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-geozentra}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      # The RDS override supplies a container path and a read-only CA mount.
      DB_SSL_ROOT_CERT: ""

volumes:
  pgdata:
